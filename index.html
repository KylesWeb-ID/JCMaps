<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JCMaps — Navigasi Peta</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0E1A24;
  --navy-soft:#16273A;
  --navy-soft-2:#1E3348;
  --amber:#F2A93B;
  --amber-dim:#B97F22;
  --teal:#2EC4B6;
  --cream:#F6F4EE;
  --gray:#7C8896;
  --line:#2A3D52;
  --danger:#E85D5D;
  --radius:16px;
  --shadow: 0 10px 30px rgba(6,12,20,0.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:var(--navy);}

#app{position:relative;width:100vw;height:100vh;height:100dvh;}
#map{position:absolute;inset:0;background:#0b141c;}

.leaflet-control-attribution{font-family:'Inter',sans-serif;font-size:10px;background:rgba(14,26,36,0.75)!important;color:#9fb0bf!important;border-radius:8px 0 0 0;}
.leaflet-control-attribution a{color:#cfe3ee!important;}

/* ---------- ICONS ---------- */
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}

/* ---------- TOP BAR ---------- */
#topbar{
  position:absolute;top:0;left:0;right:0;
  padding:16px 16px 0;
  display:flex;flex-direction:column;gap:10px;
  z-index:800;
  pointer-events:none;
}
.searchpill{
  pointer-events:auto;
  display:flex;align-items:center;gap:10px;
  background:rgba(22,39,58,0.92);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:999px;
  padding:10px 14px;
  box-shadow:var(--shadow);
  transition:box-shadow .25s ease, transform .25s ease;
}
.searchpill:focus-within{box-shadow:0 12px 34px rgba(46,196,182,0.18);border-color:rgba(46,196,182,0.55);}
.logo-mark{
  width:34px;height:34px;min-width:34px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--amber), var(--amber-dim));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px rgba(242,169,59,0.15);
}
.logo-mark svg{width:18px;height:18px;stroke:var(--navy);}
#searchInput{
  flex:1;border:none;outline:none;background:transparent;
  color:var(--cream);font-family:'Inter',sans-serif;font-size:15px;font-weight:500;
}
#searchInput::placeholder{color:var(--gray);}
.wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--cream);letter-spacing:0.2px;display:none;}
.iconbtn{
  pointer-events:auto;
  width:36px;height:36px;min-width:36px;border-radius:50%;
  border:none;background:rgba(255,255,255,0.06);color:var(--cream);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
.iconbtn:hover{background:rgba(255,255,255,0.12);}
.iconbtn:active{transform:scale(0.88);}
.iconbtn.accent{background:var(--teal);color:var(--navy);}

/* dropdown results */
#searchResults{
  pointer-events:auto;
  background:rgba(22,39,58,0.97);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
  max-height:0;
  transition:max-height .28s ease;
}
#searchResults.open{max-height:320px;overflow-y:auto;}
.result-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;cursor:pointer;
  border-top:1px solid var(--line);
  color:var(--cream);font-size:13.5px;
  animation:fadeIn .2s ease both;
}
.result-item:first-child{border-top:none;}
.result-item:hover{background:rgba(255,255,255,0.05);}
.result-item svg{color:var(--gray);min-width:18px;}
.result-item .rname{font-weight:600;}
.result-item .raddr{color:var(--gray);font-size:11.5px;margin-top:2px;}

/* ---------- DIRECTIONS PANEL ---------- */
#directionsPanel{
  pointer-events:auto;
  background:rgba(22,39,58,0.95);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  display:none;
  flex-direction:column;
  gap:10px;
  animation:slideDown .28s ease both;
}
#directionsPanel.show{display:flex;}
.field-row{display:flex;align-items:center;gap:10px;}
.field-dots{display:flex;flex-direction:column;align-items:center;gap:3px;width:14px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--teal);}
.dot.dest{background:var(--amber);border-radius:2px;}
.dotline{width:2px;height:20px;background:var(--line);}
.fields{flex:1;display:flex;flex-direction:column;gap:8px;}
.field-input{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
  color:var(--cream);font-size:13.5px;font-family:'Inter',sans-serif;
  outline:none;transition:border-color .2s ease;
}
.field-input:focus{border-color:var(--teal);}
.field-input::placeholder{color:var(--gray);}
.swapbtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,0.05);color:var(--cream);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .3s ease, background .2s ease;
}
.swapbtn:hover{background:rgba(255,255,255,0.1);}
.swapbtn.spin{transform:rotate(180deg);}

.modebar{display:flex;gap:8px;}
.modebtn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 6px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,0.03);color:var(--gray);cursor:pointer;
  font-size:12px;font-weight:600;font-family:'Inter',sans-serif;
  transition:all .18s ease;
}
.modebtn svg{width:16px;height:16px;}
.modebtn.active{background:var(--teal);border-color:var(--teal);color:var(--navy);}
.modebtn:active{transform:scale(0.95);}

.gobtn{
  background:linear-gradient(135deg, var(--teal), #24a89c);
  color:var(--navy);border:none;border-radius:10px;
  padding:11px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s ease, filter .15s ease;
}
.gobtn:hover{filter:brightness(1.08);}
.gobtn:active{transform:scale(0.97);}
.gobtn:disabled{opacity:0.45;cursor:not-allowed;}

/* ---------- SIDE CONTROLS ---------- */
#sideControls{
  position:absolute;right:14px;bottom:110px;z-index:800;
  display:flex;flex-direction:column;gap:10px;align-items:center;
}
.sidebtn{
  width:44px;height:44px;border-radius:50%;
  background:rgba(22,39,58,0.92);backdrop-filter:blur(8px);
  border:1px solid var(--line);color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--shadow);
  transition:transform .15s ease, background .2s ease, color .2s ease;
}
.sidebtn:active{transform:scale(0.88);}
.sidebtn.active{background:var(--teal);color:var(--navy);border-color:var(--teal);}
.zoomgroup{display:flex;flex-direction:column;background:rgba(22,39,58,0.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.zoombtn{width:44px;height:40px;border:none;background:transparent;color:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease;}
.zoombtn:first-child{border-bottom:1px solid var(--line);}
.zoombtn:hover{background:rgba(255,255,255,0.08);}
.zoombtn:active{background:rgba(255,255,255,0.14);}

/* ---------- TOAST ---------- */
#toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--navy-soft-2);border:1px solid var(--line);color:var(--cream);
  padding:11px 16px;border-radius:12px;font-size:13px;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);z-index:1000;opacity:0;pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  max-width:88vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
#toast svg{color:var(--amber);min-width:18px;}
#toast .toastbtn{margin-left:6px;background:var(--teal);color:var(--navy);border:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}

/* ---------- BOTTOM SHEET ---------- */
#bottomSheet{
  position:absolute;left:0;right:0;bottom:0;z-index:900;
  background:rgba(22,39,58,0.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;
  box-shadow:0 -10px 30px rgba(6,12,20,0.4);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.22,.9,.32,1);
  max-height:70vh;display:flex;flex-direction:column;
}
#bottomSheet.show{transform:translateY(0);}
#bottomSheet.expanded{max-height:80vh;}
.sheet-handle{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 4px;cursor:pointer;}
.sheet-summary{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px;border-bottom:1px solid var(--line);}
.sheet-summary .sum-left{display:flex;flex-direction:column;}
.sum-time{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--cream);}
.sum-sub{font-size:12.5px;color:var(--gray);display:flex;align-items:center;gap:6px;margin-top:2px;}
.sum-sub svg{width:14px;height:14px;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.06);border:none;color:var(--cream);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sheet-close:active{transform:scale(0.88);}
#stepsList{overflow-y:auto;padding:6px 8px 18px;}
.step-item{
  display:flex;align-items:flex-start;gap:12px;padding:10px 10px;border-radius:12px;
  animation:fadeInUp .25s ease both;
}
.step-item:hover{background:rgba(255,255,255,0.04);}
.step-icon{
  width:32px;height:32px;min-width:32px;border-radius:50%;
  background:rgba(46,196,182,0.14);color:var(--teal);
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.step-icon svg{width:16px;height:16px;}
.step-text{color:var(--cream);font-size:13.5px;font-weight:500;line-height:1.4;}
.step-dist{color:var(--gray);font-size:11.5px;margin-top:2px;}

/* ---------- MARKERS ---------- */
.pin-dest{filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4));animation:dropIn .45s cubic-bezier(.3,1.4,.5,1) both;}
.pin-origin{filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35));animation:dropIn .4s ease both;}
.gps-puck{position:relative;width:26px;height:26px;}
.gps-pulse{
  position:absolute;top:50%;left:50%;width:26px;height:26px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(46,196,182,0.35);
  animation:pulse 2.2s ease-out infinite;
}
.gps-dot{
  position:absolute;top:50%;left:50%;width:16px;height:16px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:var(--teal);border:3px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
}
.gps-arrow{
  position:absolute;top:50%;left:50%;width:34px;height:34px;
  transform:translate(-50%,-50%) rotate(0deg);
  transition:transform .35s ease;
}
.gps-arrow svg{width:100%;height:100%;color:var(--teal);filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));}

.leaflet-marker-icon{transition:transform 0.55s linear;}

/* route line glow */
.leaflet-routing-container{display:none!important;}

/* ---------- ANIMATIONS ---------- */
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0;}}
@keyframes dropIn{0%{transform:translateY(-24px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
@keyframes slideDown{0%{transform:translateY(-14px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
@keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(6px);}100%{opacity:1;transform:translateY(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.25);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;}

/* scrollbar */
#searchResults::-webkit-scrollbar, #stepsList::-webkit-scrollbar{width:5px;}
#searchResults::-webkit-scrollbar-thumb, #stepsList::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

/* ---------- RESPONSIVE ---------- */
@media (min-width:640px){
  #topbar{max-width:420px;}
  #directionsPanel{max-width:420px;}
  #searchResults{max-width:420px;}
  .wordmark{display:block;}
  #bottomSheet{left:14px;right:auto;width:400px;border-radius:20px;bottom:14px;box-shadow:var(--shadow);}
}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="topbar">
    <div class="searchpill" id="searchPillWrap">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L18 21 L12 17 L6 21 Z"/></svg>
      </div>
      <span class="wordmark">JCMaps</span>
      <input type="text" id="searchInput" placeholder="Cari tempat atau alamat...">
      <button class="iconbtn" id="btnDirectionsToggle" title="Rute">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 19 L9 6 L15 19 L20 6"/><path d="M7 13 h5"/></svg>
      </button>
    </div>

    <div id="searchResults"></div>

    <div id="directionsPanel">
      <div class="field-row">
        <div class="field-dots">
          <div class="dot" id="dotOrigin"></div>
          <div class="dotline"></div>
          <div class="dot dest" id="dotDest"></div>
        </div>
        <div class="fields">
          <input class="field-input" id="inputOrigin" placeholder="Lokasi asal...">
          <input class="field-input" id="inputDest" placeholder="Tujuan...">
        </div>
        <button class="swapbtn" id="btnSwap" title="Tukar">
          <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M7 3 L7 21"/><path d="M3 7 L7 3 L11 7"/><path d="M17 21 L17 3"/><path d="M13 17 L17 21 L21 17"/></svg>
        </button>
      </div>

      <div class="modebar">
        <button class="modebtn active" data-mode="car">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17 h14 M5 17 a1.5 1.5 0 0 1 -1.5 -1.5 V13 l1.8 -4.5 A2 2 0 0 1 7.1 7 h9.8 a2 2 0 0 1 1.8 1.5 L20.5 13 v2.5 A1.5 1.5 0 0 1 19 17"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>
          Mobil
        </button>
        <button class="modebtn" data-mode="bike">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3.2"/><circle cx="18" cy="17" r="3.2"/><path d="M6 17 L10 9 h4 M10 9 L14 17 M14 17 L18 17 L15 11 L10 9"/></svg>
          Sepeda
        </button>
        <button class="modebtn" data-mode="foot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.6"/><path d="M9 22 L10.5 15 L8 12 L9.5 8 M15 22 L13.5 14 L16 11 L14.5 8"/></svg>
          Jalan
        </button>
      </div>

      <button class="gobtn" id="btnGo" disabled>
        <svg class="icon" viewBox="0 0 24 24" style="width:17px;height:17px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Mulai Rute
      </button>
    </div>
  </div>

  <div id="sideControls">
    <button class="sidebtn" id="btnLayers" title="Ganti tampilan peta">
      <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 8 12 14 22 8 12 2"/><polyline points="2 14 12 20 22 14"/><polyline points="2 11 12 17 22 11"/></svg>
    </button>
    <button class="sidebtn" id="btnLocate" title="Lokasi saya">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2 v3 M12 19 v3 M2 12 h3 M19 12 h3"/></svg>
    </button>
    <div class="zoomgroup">
      <button class="zoombtn" id="btnZoomIn"><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M12 5 v14 M5 12 h14"/></svg></button>
      <button class="zoombtn" id="btnZoomOut"><svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M5 12 h14"/></svg></button>
    </div>
  </div>

  <div id="toast">
    <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M12 9 v4 M12 17 h.01"/><circle cx="12" cy="12" r="9"/></svg>
    <span id="toastMsg">Pesan</span>
  </div>

  <div id="bottomSheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-summary">
      <div class="sum-left">
        <div class="sum-time" id="sumTime">--</div>
        <div class="sum-sub">
          <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M4 19 L9 6 L15 19 L20 6"/></svg>
          <span id="sumDist">--</span>
        </div>
      </div>
      <button class="sheet-close" id="btnSheetClose">
        <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
      </button>
    </div>
    <div id="stepsList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.min.js"></script>
<script>
(function(){
"use strict";

/* ================= ICON SVGS (no emoji) ================= */
const ICON = {
  pin: `<svg width="34" height="44" viewBox="0 0 34 44" xmlns="http://www.w3.org/2000/svg"><path d="M17 0C7.6 0 0 7.6 0 17c0 12 17 27 17 27s17-15 17-27C34 7.6 26.4 0 17 0z" fill="#F2A93B"/><circle cx="17" cy="17" r="7" fill="#0E1A24"/></svg>`,
  origin: `<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="9" fill="#2EC4B6" stroke="#fff" stroke-width="3"/></svg>`,
  arrow: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L20 20 L12 15.5 L4 20 Z"/></svg>`,
  turnLeft: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 L4 9 L9 14"/><path d="M4 9 H14 A6 6 0 0 1 20 15 V20"/></svg>`,
  turnRight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 L20 9 L15 14"/><path d="M20 9 H10 A6 6 0 0 0 4 15 V20"/></svg>`,
  straight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20 V4 M6 10 L12 4 L18 10"/></svg>`,
  flag: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21 V4 M5 4 h13 l-3 4 l3 4 H5"/></svg>`,
  pinSm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21 C12 21 19 14.5 19 9.5 A7 7 0 0 0 5 9.5 C5 14.5 12 21 12 21 Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>`,
  roundabout: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 2 v5 M12 22 v-5 M2 12 h5 M22 12 h-5"/></svg>`
};

const TILE_LAYERS = {
  standard: {
    label: "Standar",
    url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    attr: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  },
  malam: {
    label: "Malam",
    url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    attr: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  },
  voyager: {
    label: "Voyager",
    url: "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    attr: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }
};

// Setiap moda punya server utama + server cadangan (fallback) berbeda,
// supaya kalau satu server publik sedang sibuk/off, rute tetap bisa dihitung.
const OSRM_PROFILE = {
  car:  [
    { serviceUrl: "https://router.project-osrm.org/route/v1", profile: "driving" },
    { serviceUrl: "https://routing.openstreetmap.de/routed-car/route/v1", profile: "driving" }
  ],
  bike: [
    { serviceUrl: "https://routing.openstreetmap.de/routed-bike/route/v1", profile: "bike" },
    { serviceUrl: "https://routing.openstreetmap.de/routed-bike/route/v1", profile: "driving" }
  ],
  foot: [
    { serviceUrl: "https://routing.openstreetmap.de/routed-foot/route/v1", profile: "foot" },
    { serviceUrl: "https://routing.openstreetmap.de/routed-foot/route/v1", profile: "driving" }
  ]
};

/* ================= STATE ================= */
let map, tileLayer, currentTileKey = "standard";
let gpsMarker = null, gpsCircle = null, watchId = null, followMode = true;
let originMarker = null, destMarker = null;
let routingControl = null;
let originLatLng = null, destLatLng = null;
let currentMode = "car";
let searchTimer = null;
let activeSearchTarget = "quick"; // 'quick' | 'origin' | 'dest'

/* ================= MAP INIT ================= */
function initMap(){
  map = L.map('map', { zoomControl:false, attributionControl:true }).setView([-6.2088, 106.8456], 13);
  tileLayer = L.tileLayer(TILE_LAYERS.standard.url, {
    subdomains: 'abc', maxZoom: 19, attribution: TILE_LAYERS.standard.attr
  }).addTo(map);
}

function setTileLayer(key){
  currentTileKey = key;
  const cfg = TILE_LAYERS[key];
  map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(cfg.url, { subdomains:'abc', maxZoom:19, attribution: cfg.attr }).addTo(map);
  showToast(`Tampilan peta: ${cfg.label}`, false);
}

/* ================= TOAST ================= */
let toastTimer = null;
function showToast(msg, persistent, actionLabel, actionFn){
  const t = document.getElementById('toast');
  const m = document.getElementById('toastMsg');
  const old = t.querySelector('.toastbtn');
  if(old) old.remove();
  m.textContent = msg;
  if(actionLabel){
    const b = document.createElement('button');
    b.className = 'toastbtn';
    b.textContent = actionLabel;
    b.onclick = actionFn;
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  if(!persistent){
    toastTimer = setTimeout(()=> t.classList.remove('show'), 3200);
  }
}
function hideToast(){ document.getElementById('toast').classList.remove('show'); }

/* ================= GEOLOCATION (GPS REAL-TIME) ================= */
function requestGeolocation(){
  if(!('geolocation' in navigator)){
    showToast('Perangkat tidak mendukung Geolocation API', false);
    return;
  }
  showToast('Meminta izin lokasi...', true);
  navigator.geolocation.getCurrentPosition(
    pos => { hideToast(); onLocationUpdate(pos); startWatch(); centerOnUser(true); },
    err => handleGeoError(err),
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}

function startWatch(){
  if(watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(
    onLocationUpdate,
    err => handleGeoError(err),
    { enableHighAccuracy:true, maximumAge:1000, timeout:15000 }
  );
}

function handleGeoError(err){
  hideToast();
  let msg = 'Tidak dapat mengambil lokasi.';
  if(err.code === 1) msg = 'Izin lokasi ditolak.';
  else if(err.code === 2) msg = 'Posisi tidak tersedia.';
  else if(err.code === 3) msg = 'Waktu permintaan lokasi habis.';
  showToast(msg, true, 'Coba lagi', () => { hideToast(); requestGeolocation(); });
}

function buildGpsIcon(heading){
  const rot = (typeof heading === 'number' && !isNaN(heading)) ? heading : 0;
  const hasHeading = (typeof heading === 'number' && !isNaN(heading));
  return L.divIcon({
    className: '',
    html: `<div class="gps-puck">
             <div class="gps-pulse"></div>
             ${hasHeading ? `<div class="gps-arrow" style="transform:translate(-50%,-50%) rotate(${rot}deg)">${ICON.arrow}</div>` : `<div class="gps-dot"></div>`}
           </div>`,
    iconSize:[26,26], iconAnchor:[13,13]
  });
}

function onLocationUpdate(pos){
  const { latitude, longitude, accuracy, heading } = pos.coords;
  const latlng = [latitude, longitude];

  if(!gpsMarker){
    gpsMarker = L.marker(latlng, { icon: buildGpsIcon(heading), zIndexOffset: 1000 }).addTo(map);
  } else {
    gpsMarker.setLatLng(latlng);
    gpsMarker.setIcon(buildGpsIcon(heading));
  }

  if(!gpsCircle){
    gpsCircle = L.circle(latlng, { radius: accuracy, color:'#2EC4B6', weight:1, fillColor:'#2EC4B6', fillOpacity:0.12 }).addTo(map);
  } else {
    gpsCircle.setLatLng(latlng);
    gpsCircle.setRadius(accuracy);
  }

  if(followMode){
    map.panTo(latlng, { animate:true, duration:0.6 });
  }

  document.getElementById('inputOrigin').dataset.lat = latitude;
  document.getElementById('inputOrigin').dataset.lng = longitude;
  if(document.getElementById('inputOrigin').value === '' || document.getElementById('inputOrigin').dataset.auto === '1'){
    document.getElementById('inputOrigin').value = 'Lokasi Anda';
    document.getElementById('inputOrigin').dataset.auto = '1';
  }
}

function centerOnUser(zoomIn){
  if(gpsMarker){
    map.setView(gpsMarker.getLatLng(), zoomIn ? 16 : map.getZoom(), { animate:true });
  }
}

/* ================= SEARCH (NOMINATIM / OSM) ================= */
async function nominatimSearch(query){
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'id' } });
  if(!res.ok) throw new Error('Gagal mencari');
  return res.json();
}

function renderResults(list, targetInputId){
  const wrap = document.getElementById('searchResults');
  wrap.innerHTML = '';
  if(!list.length){
    wrap.classList.remove('open');
    return;
  }
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'result-item';
    const mainName = item.display_name.split(',')[0];
    const rest = item.display_name.split(',').slice(1,3).join(',').trim();
    div.innerHTML = `${ICON.pinSm}<div><div class="rname">${mainName}</div><div class="raddr">${rest}</div></div>`;
    div.addEventListener('click', () => selectResult(item, targetInputId));
    wrap.appendChild(div);
  });
  wrap.classList.add('open');
}

function selectResult(item, targetInputId){
  const latlng = [parseFloat(item.lat), parseFloat(item.lon)];
  document.getElementById('searchResults').classList.remove('open');

  if(targetInputId === 'quick'){
    document.getElementById('searchInput').value = item.display_name.split(',')[0];
    if(destMarker) map.removeLayer(destMarker);
    destMarker = L.marker(latlng, { icon: L.divIcon({ className:'pin-dest', html: ICON.pin, iconSize:[34,44], iconAnchor:[17,44] }) }).addTo(map);
    map.flyTo(latlng, 15, { duration: 0.9 });
    destLatLng = latlng;
    document.getElementById('inputDest').value = item.display_name.split(',')[0];
    document.getElementById('btnGo').disabled = !(originLatLng || document.getElementById('inputOrigin').dataset.lat);
  } else if(targetInputId === 'inputOrigin'){
    document.getElementById('inputOrigin').value = item.display_name.split(',')[0];
    document.getElementById('inputOrigin').dataset.auto = '0';
    originLatLng = latlng;
    if(originMarker) map.removeLayer(originMarker);
    originMarker = L.marker(latlng, { icon: L.divIcon({ className:'pin-origin', html: ICON.origin, iconSize:[22,22], iconAnchor:[11,11] }) }).addTo(map);
    checkGoEnabled();
  } else if(targetInputId === 'inputDest'){
    document.getElementById('inputDest').value = item.display_name.split(',')[0];
    destLatLng = latlng;
    if(destMarker) map.removeLayer(destMarker);
    destMarker = L.marker(latlng, { icon: L.divIcon({ className:'pin-dest', html: ICON.pin, iconSize:[34,44], iconAnchor:[17,44] }) }).addTo(map);
    map.flyTo(latlng, 14, { duration: 0.9 });
    checkGoEnabled();
  }
}

function checkGoEnabled(){
  const hasOrigin = originLatLng || document.getElementById('inputOrigin').dataset.lat;
  document.getElementById('btnGo').disabled = !(hasOrigin && destLatLng);
}

function wireSearchInput(inputEl, targetId){
  inputEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = inputEl.value.trim();
    activeSearchTarget = targetId;
    if(q.length < 3){ document.getElementById('searchResults').classList.remove('open'); return; }
    searchTimer = setTimeout(async () => {
      try{
        const list = await nominatimSearch(q);
        if(activeSearchTarget === targetId) renderResults(list, targetId);
      }catch(e){ /* silent fail, network hiccup */ }
    }, 420);
  });
}

/* ================= ROUTING ================= */
function buildStepIcon(type, modifier){
  if(type === 'DepartLeft' || type === 'DepartRight' || type === 'Depart') return ICON.pinSm;
  if(type === 'ArriveLeft' || type === 'ArriveRight' || type === 'Arrive') return ICON.flag;
  if(type === 'Roundabout' || type === 'Rotary') return ICON.roundabout;
  if(modifier && modifier.includes('left')) return ICON.turnLeft;
  if(modifier && modifier.includes('right')) return ICON.turnRight;
  return ICON.straight;
}

function formatDuration(sec){
  const min = Math.round(sec/60);
  if(min < 60) return `${min} menit`;
  const h = Math.floor(min/60), m = min%60;
  return `${h} jam ${m} menit`;
}
function formatDistance(m){
  if(m < 1000) return `${Math.round(m)} m`;
  return `${(m/1000).toFixed(1)} km`;
}

function clearRoute(){
  if(routingControl){ map.removeControl(routingControl); routingControl = null; }
  document.getElementById('bottomSheet').classList.remove('show');
}

function tryRouteWithServer(serverIndex){
  const servers = OSRM_PROFILE[currentMode];
  if(serverIndex >= servers.length){
    showToast('Semua server rute publik sedang tidak bisa dijangkau. Cek koneksi internet Anda, atau coba lagi sebentar lagi.', false);
    return;
  }
  const cfg = servers[serverIndex];

  if(routingControl){ map.removeControl(routingControl); routingControl = null; }

  routingControl = L.Routing.control({
    waypoints: [ L.latLng(originLatLng[0], originLatLng[1]), L.latLng(destLatLng[0], destLatLng[1]) ],
    router: L.Routing.osrmv1({ serviceUrl: cfg.serviceUrl, profile: cfg.profile, useHints: false }),
    addWaypoints: false,
    draggableWaypoints: false,
    fitSelectedRoutes: true,
    show: false,
    lineOptions: { styles: [ { color:'#0E1A24', opacity:0.5, weight:9 }, { color:'#2EC4B6', opacity:0.95, weight:5 } ], addWaypoints:false },
    createMarker: function(i, wp){
      if(i === 0){
        return L.marker(wp.latLng, { icon: L.divIcon({ className:'pin-origin', html: ICON.origin, iconSize:[22,22], iconAnchor:[11,11] }) });
      }
      return L.marker(wp.latLng, { icon: L.divIcon({ className:'pin-dest', html: ICON.pin, iconSize:[34,44], iconAnchor:[17,44] }) });
    }
  }).addTo(map);

  routingControl.on('routesfound', function(e){
    const route = e.routes[0];
    document.getElementById('sumTime').textContent = formatDuration(route.summary.totalTime);
    document.getElementById('sumDist').textContent = formatDistance(route.summary.totalDistance);

    const stepsWrap = document.getElementById('stepsList');
    stepsWrap.innerHTML = '';
    route.instructions.forEach((ins, idx) => {
      const div = document.createElement('div');
      div.className = 'step-item';
      div.style.animationDelay = (idx*0.03)+'s';
      div.innerHTML = `<div class="step-icon">${buildStepIcon(ins.type, ins.modifier)}</div>
        <div><div class="step-text">${ins.text}</div><div class="step-dist">${formatDistance(ins.distance)}</div></div>`;
      stepsWrap.appendChild(div);
    });

    document.getElementById('bottomSheet').classList.add('show');
    followMode = false;
    document.getElementById('btnLocate').classList.remove('active');
  });

  routingControl.on('routingerror', function(e){
    // Info detail error ditulis ke console supaya mudah didiagnosis (F12 > Console)
    console.error('JCMaps routing error dari', cfg.serviceUrl, e.error || e);
    const reason = e && e.error && e.error.message ? e.error.message : '';
    if(/NoRoute|NoSegment/i.test(reason)){
      showToast('Tidak ditemukan jalur antara dua lokasi tersebut.', false);
      return;
    }
    // coba server cadangan berikutnya secara otomatis
    tryRouteWithServer(serverIndex + 1);
  });
}

function computeRoute(){
  if(!originLatLng && document.getElementById('inputOrigin').dataset.lat){
    originLatLng = [parseFloat(document.getElementById('inputOrigin').dataset.lat), parseFloat(document.getElementById('inputOrigin').dataset.lng)];
  }
  if(!originLatLng || !destLatLng){
    showToast('Tentukan lokasi asal dan tujuan terlebih dahulu', false);
    return;
  }
  clearRoute();
  showToast('Menghitung rute...', true);
  tryRouteWithServer(0);
  setTimeout(hideToast, 1800);
}

/* ================= UI WIRING ================= */
function init(){
  initMap();
  wireSearchInput(document.getElementById('searchInput'), 'quick');
  wireSearchInput(document.getElementById('inputOrigin'), 'inputOrigin');
  wireSearchInput(document.getElementById('inputDest'), 'inputDest');

  document.getElementById('inputOrigin').addEventListener('focus', () => { document.getElementById('inputOrigin').dataset.auto = '0'; });

  document.getElementById('btnDirectionsToggle').addEventListener('click', () => {
    const panel = document.getElementById('directionsPanel');
    panel.classList.toggle('show');
    document.getElementById('searchResults').classList.remove('open');
    if(panel.classList.contains('show') && document.getElementById('inputOrigin').value === '' && gpsMarker){
      document.getElementById('inputOrigin').value = 'Lokasi Anda';
      document.getElementById('inputOrigin').dataset.auto = '1';
      originLatLng = null;
    }
  });

  document.getElementById('btnSwap').addEventListener('click', (e) => {
    e.currentTarget.classList.add('spin');
    setTimeout(()=> e.currentTarget.classList.remove('spin'), 320);
    const o = document.getElementById('inputOrigin'), d = document.getElementById('inputDest');
    const tmpVal = o.value; o.value = d.value; d.value = tmpVal;
    const tmpLL = originLatLng; originLatLng = destLatLng; destLatLng = tmpLL;
    checkGoEnabled();
  });

  document.querySelectorAll('.modebtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.modebtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      if(routingControl) computeRoute();
    });
  });

  document.getElementById('btnGo').addEventListener('click', computeRoute);

  document.getElementById('btnLocate').addEventListener('click', () => {
    followMode = true;
    document.getElementById('btnLocate').classList.add('active');
    if(gpsMarker){ centerOnUser(true); }
    else { requestGeolocation(); }
  });

  map.on('dragstart', () => {
    followMode = false;
    document.getElementById('btnLocate').classList.remove('active');
  });

  document.getElementById('btnLayers').addEventListener('click', () => {
    const keys = Object.keys(TILE_LAYERS);
    const idx = keys.indexOf(currentTileKey);
    setTileLayer(keys[(idx+1) % keys.length]);
  });

  document.getElementById('btnZoomIn').addEventListener('click', () => map.zoomIn());
  document.getElementById('btnZoomOut').addEventListener('click', () => map.zoomOut());

  document.getElementById('sheetHandle').addEventListener('click', () => {
    document.getElementById('bottomSheet').classList.toggle('expanded');
  });
  document.getElementById('btnSheetClose').addEventListener('click', () => {
    clearRoute();
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('#searchPillWrap') && !e.target.closest('#searchResults') && !e.target.closest('#directionsPanel')){
      document.getElementById('searchResults').classList.remove('open');
    }
  });

  // auto request location on load
  requestGeolocation();
}

window.addEventListener('load', init);
})();
</script>
